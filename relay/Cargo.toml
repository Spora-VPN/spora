[package]
name = "relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"]}
socket2 = "0.5.6"
clap = { version = "4.5.52", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"
relay-client = { path = "../relay-client" }
# fallible_uint: u64 counters bind as INTEGER and fail above i64::MAX, as
# rusqlite 0.32 did by default.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
